<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lüftersteuerung</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Wrapper: umschließt alles, 100% Breite und Höhe -->
  <div class="wrapper">

    <!-- Container 1: linke Hälfte, 50% Breite, 100% Höhe -->
    <div class="container" id="container-links">
      <h2>Bedienteil</h2>

      <!-- Unter-Container in Container 1 -->
      <div class="sub-container"></div>
      <div class="sub-container"></div>

    </div>

    <!-- Container 2: rechte Hälfte, 50% Breite, 100% Höhe -->
    <div class="container" id="container-rechts">
      <h2>Anzeigeteil</h2>

      <!-- Unter-Container in Container 2 -->
      <div class="sub-container"></div>
      <div class="sub-container"></div>

    </div>

  </div>

</body>
</html>
