<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fan control</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="dev-banner">
      🚧 Functional prototype – All core features are fully implemented and
      ready for use. Code refactoring is currently in progress.
    </div>
    <div class="wrapper">
      <div class="container" id="container-links">
        <h2>Control panel</h2>
        <div class="containerButtons">
          <div class="sub-container1">
            <button class="taster taster--ein">ON</button>
            <button class="taster taster--aus">OFF</button>
          </div>
          <div class="sub-container2">
            <button class="taster taster--hoch">UP</button>
            <button class="taster taster--runter">DOWN</button>
          </div>
        </div>
      </div>

      <div class="container" id="container-rechts">
        <h2 id="h2Anzeigefeld">Display field</h2>

        <div class="sub-container3">
          <!-- LED status indicator -->
          <div class="led-group1">
            <h1>Fan status display</h1>
            <div class="led-items1">
              <div class="led" id="symbol-led1"></div>
              <span class="led-label1">OFF</span>
            </div>

            <div class="led-items1">
              <div class="led" id="symbol-led2"></div>
              <span class="led-label1">ON</span>
            </div>

            <div class="led-items1">
              <div class="led" id="symbol-led3"></div>
              <span class="led-label1">FAULT</span>
            </div>
          </div>

          <!-- Combine container bargraph, container matrix display, and container RPM display -->
          <div class="containerSum">
            <!-- 2. Bargraph: Fan levels -->
            <div class="led-group2">
              <h1>Fan stages</h1>
              <!-- Container for the 4 LEDs side by side -->
              <div class="led-container2">
                <div class="led-wrapper">
                  <div class="led" id="led1"></div>
                  <span class="led-label2">1</span>
                </div>

                <div class="led-wrapper">
                  <div class="led" id="led2"></div>
                  <span class="led-label2">2</span>
                </div>

                <div class="led-wrapper">
                  <div class="led" id="led3"></div>
                  <span class="led-label2">3</span>
                </div>

                <div class="led-wrapper">
                  <div class="led" id="led4"></div>
                  <span class="led-label2">4</span>
                </div>
              </div>
            </div>

            <!-- Segment display or LED matrix. -->
            <div class="matrix-panel">
              <h1>Matrix display</h1>
              <div class="matrix-display n0">
                <!-- Row 1 to 4 -->
                <div id="p1"></div>
                <div id="p2"></div>
                <div id="p3"></div>
                <div id="p4"></div>
                <div id="p5"></div>
                <div id="p6"></div>
                <div id="p7"></div>
                <div id="p8"></div>
                <div id="p9"></div>
                <div id="p10"></div>
                <div id="p11"></div>
                <div id="p12"></div>
                <div id="p13"></div>
                <div id="p14"></div>
                <div id="p15"></div>
                <div id="p16"></div>
                <!-- Row 5 to 9 -->
                <div id="p17"></div>
                <div id="p18"></div>
                <div id="p19"></div>
                <div id="p20"></div>
                <div id="p21"></div>
                <div id="p22"></div>
                <div id="p23"></div>
                <div id="p24"></div>
                <div id="p25"></div>
                <div id="p26"></div>
                <div id="p27"></div>
                <div id="p28"></div>
                <div id="p29"></div>
                <div id="p30"></div>
                <div id="p31"></div>
                <div id="p32"></div>
                <div id="p33"></div>
                <div id="p34"></div>
                <div id="p35"></div>
                <div id="p36"></div>
              </div>
            </div>

            <!-- Speed display in RPM -->
            <div class="rpm-panel">
              <h1>RPM (Speed)</h1>
              <div class="rpm-display" id="rpm-value">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
